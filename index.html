  <script>
    // -- Controle de layout: 'webpro' (default) | 'dinamico' (Padrão) | 'original' (Antigo) --
    function aplicarLayout(layout) {
      var isWeb    = (layout === 'webpro');
      var sec      = document.getElementById('section-beneficios');
      var services = document.querySelector('dmaior-services-menu');
      var webpro   = document.querySelector('dmaior-home-webpro');
      var live     = document.querySelector('kwai-live-widget');
      // Benefícios/FAQ: aparece só no layout "Antigo" (Web Pro e Padrão têm os seus)
      if (sec)      sec.style.display      = (isWeb || layout === 'dinamico') ? 'none' : '';
      if (services) services.style.display = isWeb ? 'none' : '';
      if (webpro)   webpro.style.display   = isWeb ? '' : 'none';
      // Web Pro: a faixa "AO VIVO" vira um card arredondado, solto (não colada no topo)
      if (live) { if (isWeb) live.setAttribute('data-layout', 'webpro'); else live.removeAttribute('data-layout'); }
    }

    // Aplica o layout salvo imediatamente ao carregar a página (default: Web Pro)
    try {
      aplicarLayout(localStorage.getItem('dm_layout') || 'webpro');
    } catch (e) { aplicarLayout('webpro'); }

    // Reage em tempo real quando o usuário troca o layout via engrenagem
    window.addEventListener('dmaior:layout', function(e) {
      try { aplicarLayout(e.detail && e.detail.layout ? e.detail.layout : 'webpro'); }
      catch (e) {}
    });
  </script>
