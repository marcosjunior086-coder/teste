  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Painel do Streamer - DMaior Agency</title>
  <!-- CSS global - define variáveis de tema usadas pelo menu-mobile e componentes -->
  <link rel="stylesheet" href="css/fonts.css?v=20261031-local">
  <link rel="preconnect" href="https://rank.agencydmaior.com.br" crossorigin>
  <link rel="stylesheet" href="css/global.css?v=20261031-traco">
  <link rel="stylesheet" href="css/components.css?v=20261031-traco">
  <style>
    /* Base mínima - o próprio componente define todo o visual */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--dm-bg, #0c0c0c);
      width: 100%;
    }
    /* body em coluna: menu do topo + painel ocupando toda a altura restante da
       janela. Assim a sidebar do painel estica 100% até a base da tela, sem
       "cortar" o fundo quando o conteúdo é curto. */
    body { min-height: 100vh; display: flex; flex-direction: column; }
    menu-mobile-dmaior { flex: 0 0 auto; }
    dmaior-app {
      display: flex;
      flex: 1 0 auto;
      width: 100%;
      min-height: 0;
    }
  </style>
</head>
<body>
  <!-- Menu público do site (tema/login compartilhado) -->
  <menu-mobile-dmaior></menu-mobile-dmaior>

  <!-- Componente painel completo - login + dashboard + carteira + perfil embutidos -->
  <dmaior-app></dmaior-app>

  <!-- api.js centraliza URLs dos workers -->
  <script defer charset=utf-8 src="js/preferences.js?v=20260921-regras-diretrizes"></script>
  <script defer charset=utf-8 src="js/utils/helpers.js?v=20261031-traco"></script>
  <script defer charset=utf-8 src="js/utils/video-compat.js?v=20261031-traco"></script>
  <script defer charset=utf-8 src="js/api.js?v=20261031-traco"></script>
  <!-- auth.js para sessão compartilhada com o menu -->
  <script defer charset=utf-8 src="js/auth.js?v=20261031-traco"></script>
  <!-- Componente impulso - carregado antes do painel para estar definido quando usado -->
  <script defer charset=utf-8 src="js/components/dmaior-impulso.js?v=20261031-traco"></script>
  <!-- Componente votação - carregado antes do painel para estar definido quando usado -->
  <script defer charset=utf-8 src="js/components/dmaior-votacao.js?v=20261031-traco"></script>
  <!-- Componente ranking inline - mesma versão completa do rank geral (tema, layout dinâmico, comunicados) -->
  <script defer charset=utf-8 src="js/components/ranking.js?v=20261031-traco"></script>
  <!-- Componente PK Diário - carregado antes do painel para estar definido quando usado -->
  <script defer charset=utf-8 src="js/components/painel-pk.js?v=20261031-traco"></script>
  <!-- Componente Tickets & Presentes - carregado antes do painel para estar definido quando usado -->
  <script defer charset=utf-8 src="js/components/dmaior-tickets.js?v=20261031-traco"></script>
  <!-- Componente Indicações/Afiliados - carregado antes do painel para estar definido quando usado -->
  <script defer charset=utf-8 src="js/components/dmaior-afiliado.js?v=20261031-traco"></script>
  <!-- Componente Regras e Diretrizes - carregado antes do painel para estar definido quando usado -->
  <script defer charset=utf-8 src="js/components/regras-diretrizes.js?v=20261031-traco"></script>
  <!-- Componente painel original - todo visual e fluxo completo -->
  <script defer charset=utf-8 src="js/components/dmaior-app.js?v=20261031-traco"></script>
  <!-- Menu mobile (inicializa tema e área de login no topo) -->
  <script defer charset=utf-8 src="js/components/menu-mobile.js?v=20261031-traco"></script>
  <!-- Notificações push (Fase 1) - convite + controle no Perfil + registro do aparelho -->
  <script defer charset=utf-8 src="js/push.js?v=20261031-traco"></script>
  <!-- router.js NÃO é carregado aqui: o painel tem fluxo de login próprio -->
  <dmaior-cookie-consent></dmaior-cookie-consent>
  <script defer charset=utf-8 src="js/components/cookie-consent.js?v=20261031-traco"></script>
  <script defer charset=utf-8 src="js/utils/visita.js?v=20261031-traco"></script>
  <script defer charset=utf-8 src="js/pwa.js?v=20260703-pwa-1"></script>
</body>
