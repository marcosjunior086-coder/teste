<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png?v=20260703-favicon-1">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png?v=20260703-favicon-1">
<link rel="icon" type="image/png" sizes="64x64" href="../assets/icons/favicon.png?v=20260703-favicon-1">
<title>Busca UID Kwai — DMaior Agency</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --card-border: #e7e8ec;
    --input-bg: #f4f5f7;
    --input-border: #e2e3e8;
    --text: #1c1d21;
    --text-dim: #85868c;
    --orange: #FF6A00;
    --orange-dark: #E85A00;
    --orange-soft: #FFF1E6;
    --ok: #17A860;
    --erro: #E5484D;
    --erro-bg: #FDECEC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 28px 18px 60px;
    min-height: 100vh;
  }
  .icon { display: inline-flex; flex-shrink: 0; }
  .icon svg { width: 100%; height: 100%; display: block; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .brand-row { display: flex; align-items: center; }
  .brand-logo { width: 46px; height: 46px; border-radius: 11px; display: block; }

  .kwai-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 99px;
    padding: 6px 12px 6px 8px;
  }
  .kwai-badge .icon { width: 20px; height: 20px; color: var(--orange); }
  .kwai-badge span { font-size: 13px; font-weight: 700; color: var(--text); }

  .titulo-ferramenta { text-align: center; margin-bottom: 22px; }
  .titulo-ferramenta h1 {
    font-size: 21px;
    margin: 0 0 5px;
    font-weight: 800;
    color: var(--text);
  }
  .titulo-ferramenta p {
    margin: 0;
    font-size: 13px;
    color: var(--text-dim);
  }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 1px 3px rgba(20,20,25,0.04), 0 8px 24px rgba(20,20,25,0.05);
  }
  form {
    display: flex;
    gap: 10px;
  }
  .campo-busca {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 10px;
    padding: 0 12px;
    transition: border-color .15s;
  }
  .campo-busca:focus-within { border-color: var(--orange); }
  .campo-busca .icon { width: 17px; height: 17px; color: var(--text-dim); }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    background: none;
    border: none;
    padding: 12px 0;
    color: var(--text);
    font-size: 15px;
    outline: none;
  }
  input[type="text"]::placeholder { color: var(--text-dim); }
  button.btn-buscar {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(180deg, var(--orange), var(--orange-dark));
    border: none;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    border-radius: 10px;
    padding: 0 18px;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
  }
  button.btn-buscar .icon { width: 16px; height: 16px; }
  button.btn-buscar:active { transform: scale(0.97); }
  button.btn-buscar:disabled { opacity: 0.55; cursor: default; }
  .dica {
    margin: 10px 2px 0;
    font-size: 12px;
    color: var(--text-dim);
  }

  .estado { margin-top: 22px; display: none; }
  .estado.mostrar { display: block; }

  .spinner {
    width: 22px; height: 22px;
    border: 3px solid var(--card-border);
    border-top-color: var(--orange);
    border-radius: 50%;
    margin: 0 auto;
    animation: girar 0.7s linear infinite;
  }
  @keyframes girar { to { transform: rotate(360deg); } }
  .carregando { text-align: center; color: var(--text-dim); font-size: 14px; }
  .carregando .spinner { margin-bottom: 10px; }

  .erro-box {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--erro-bg);
    border: 1px solid rgba(229,72,77,0.25);
    color: var(--erro);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 14px;
  }
  .erro-box .icon { width: 20px; height: 20px; flex-shrink: 0; }

  .resultado { text-align: center; }
  .avatar {
    width: 84px; height: 84px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--input-bg);
    border: 2px solid var(--card-border);
    margin: 0 auto 12px;
    display: block;
  }
  .avatar-fallback {
    width: 84px; height: 84px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--orange), var(--orange-dark));
    margin: 0 auto 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    font-weight: 700;
    color: #fff;
  }
  .nome-linha {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 17px;
    font-weight: 800;
  }
  .selo-ok { display: inline-flex; width: 17px; height: 17px; color: var(--ok); flex-shrink: 0; }
  .kwai-id { color: var(--text-dim); font-size: 13px; margin-top: 2px; }

  .uid-box {
    margin-top: 18px;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 14px;
  }
  .uid-box .rotulo {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin-bottom: 3px;
  }
  .uid-box .valor {
    font-size: 18px;
    font-weight: 700;
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
    white-space: nowrap;
  }
  .btn-copiar {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #fff;
    border: 1px solid var(--input-border);
    color: var(--text);
    border-radius: 9px;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
    white-space: nowrap;
  }
  .btn-copiar .icon { width: 15px; height: 15px; }
  .btn-copiar:hover { border-color: var(--orange); color: var(--orange-dark); }
  .btn-copiar.copiado {
    background: rgba(23,168,96,0.08);
    border-color: var(--ok);
    color: var(--ok);
  }

  .extra-info { margin-top: 14px; font-size: 13px; color: var(--text-dim); }

  footer {
    text-align: center;
    margin-top: 26px;
    font-size: 11px;
    color: var(--text-dim);
  }

  @media (min-width: 600px) {
    .wrap { max-width: 620px; padding-top: 40px; }
    .titulo-ferramenta h1 { font-size: 23px; }
    .card { padding: 26px 30px; }
  }
  @media (min-width: 900px) {
    .wrap { max-width: 640px; padding-top: 56px; }
  }
</style>
</head>

      <div class="kwai-badge">
        <span class="icon">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="15" cy="15" r="8"></circle>
            <circle cx="27" cy="12" r="5.5"></circle>
            <rect x="6" y="23" width="26" height="18" rx="5"></rect>
            <path d="M34 28l8-4.5v15L34 34z"></path>
          </svg>
        </span>
        <span>kwai</span>
      </div>
    </header>

    <div class="titulo-ferramenta">
      <h1>Busca UID Kwai</h1>
      <p>Descubra o UID numérico de qualquer criador a partir do ID (usuário)</p>
    </div>

    <div class="card">
      <form id="formBusca" autocomplete="off">
        <div class="campo-busca">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </span>
          <input type="text" id="inputId" placeholder="ex: amandinhanery" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false">
        </div>
        <button type="submit" class="btn-buscar" id="btnBuscar">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </span>
          Buscar
        </button>
      </form>
      <div class="dica">Pode digitar com ou sem "@" na frente.</div>

      <div class="estado" id="estadoCarregando">
        <div class="carregando">
          <div class="spinner"></div>
          Consultando a Kwai...
        </div>
      </div>

      <div class="estado" id="estadoErro">
        <div class="erro-box">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="13"></line><line x1="12" y1="16.5" x2="12" y2="16.51"></line></svg>
          </span>
          <span id="msgErro"></span>
        </div>
      </div>

      <div class="estado" id="estadoResultado">
        <div class="resultado">
          <img class="avatar" id="resAvatar" alt="" style="display:none;">
          <div class="avatar-fallback" id="resAvatarFallback" style="display:none;"></div>
          <div class="nome-linha">
            <span id="resNome"></span>
            <span class="selo-ok" id="resSelo" title="Verificado" style="display:none;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="8 12.5 11 15.5 16 9"></polyline></svg>
            </span>
          </div>
          <div class="kwai-id" id="resKwaiId"></div>

          <div class="uid-box">
            <div>
              <div class="rotulo">UID</div>
              <div class="valor" id="resUid"></div>
            </div>
            <button class="btn-copiar" id="btnCopiar" type="button">
              <span class="icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              </span>
              Copiar UID
            </button>
          </div>

          <div class="extra-info" id="resExtra"></div>
        </div>
      </div>
    </div>

    <footer>Ferramenta DMaior Agency para parceiros — resolução pública de UID Kwai</footer>
  </div>

<script>
  const WORKER_URL = 'https://busca-uid.agencydmaior.com.br';

  const form              = document.getElementById('formBusca');
  const inputId           = document.getElementById('inputId');
  const btnBuscar         = document.getElementById('btnBuscar');
  const estadoCarregando  = document.getElementById('estadoCarregando');
  const estadoErro        = document.getElementById('estadoErro');
  const estadoResultado   = document.getElementById('estadoResultado');
  const msgErro           = document.getElementById('msgErro');
  const resAvatar         = document.getElementById('resAvatar');
  const resAvatarFallback = document.getElementById('resAvatarFallback');
  const resNome           = document.getElementById('resNome');
  const resSelo           = document.getElementById('resSelo');
  const resKwaiId         = document.getElementById('resKwaiId');
  const resUid            = document.getElementById('resUid');
  const resExtra          = document.getElementById('resExtra');
  const btnCopiar         = document.getElementById('btnCopiar');
  const btnBuscarTexto    = btnBuscar.lastChild;

  function esconderTudo() {
    estadoCarregando.classList.remove('mostrar');
    estadoErro.classList.remove('mostrar');
    estadoResultado.classList.remove('mostrar');
  }

  function mostrarCarregando() {
    esconderTudo();
    estadoCarregando.classList.add('mostrar');
  }

  function mostrarErro(msg) {
    esconderTudo();
    msgErro.textContent = msg;
    estadoErro.classList.add('mostrar');
  }

  function mostrarResultado(d) {
    esconderTudo();
    resNome.textContent = d.nome || d.kwai_id || '(sem nome)';
    resKwaiId.textContent = '@' + (d.kwai_id || '');
    resUid.textContent = d.uid;
    resSelo.style.display = d.verificado ? 'inline-flex' : 'none';

    if (d.foto) {
      resAvatar.src = d.foto;
      resAvatar.style.display = 'block';
      resAvatarFallback.style.display = 'none';
      resAvatar.onerror = function () {
        resAvatar.style.display = 'none';
        resAvatarFallback.style.display = 'flex';
        resAvatarFallback.textContent = (d.nome || d.kwai_id || '?').trim().charAt(0).toUpperCase();
      };
    } else {
      resAvatar.style.display = 'none';
      resAvatarFallback.style.display = 'flex';
      resAvatarFallback.textContent = (d.nome || d.kwai_id || '?').trim().charAt(0).toUpperCase();
    }

    const partes = [];
    if (typeof d.seguidores === 'number') partes.push(d.seguidores.toLocaleString('pt-BR') + ' seguidores');
    if (d.verificado && d.verificado_desc) partes.push(d.verificado_desc);
    resExtra.textContent = partes.join(' · ');

    btnCopiar.classList.remove('copiado');
    btnCopiar.lastChild.textContent = 'Copiar UID';
    estadoResultado.classList.add('mostrar');
  }

  async function buscar(id) {
    mostrarCarregando();
    btnBuscar.disabled = true;
    try {
      const resp = await fetch(WORKER_URL + '/resolver?id=' + encodeURIComponent(id));
      const dados = await resp.json();
      if (dados.ok) {
        mostrarResultado(dados);
      } else {
        mostrarErro(dados.erro || 'Não foi possível concluir a busca.');
      }
    } catch (e) {
      mostrarErro('Falha ao conectar com o serviço de busca.');
    } finally {
      btnBuscar.disabled = false;
    }
  }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    const id = inputId.value.trim();
    if (!id) return;
    buscar(id);
  });

  btnCopiar.addEventListener('click', async function () {
    const uid = resUid.textContent.trim();
    if (!uid) return;
    try {
      await navigator.clipboard.writeText(uid);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = uid;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    btnCopiar.classList.add('copiado');
    btnCopiar.lastChild.textContent = 'Copiado!';
    setTimeout(function () {
      btnCopiar.classList.remove('copiado');
      btnCopiar.lastChild.textContent = 'Copiar UID';
    }, 1800);
  });
</script>
