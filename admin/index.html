<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script>
    document.write('<base href="' + (location.pathname.startsWith('/teste/') ? '/teste/' : '/') + '">');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0e27">
  <link rel="manifest" href="admin.webmanifest?v=20260723-logo-fix">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=20260703-favicon-1">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png?v=20260703-favicon-1">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/icons/favicon.png?v=20260703-favicon-1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="DMaior Admin">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="color-scheme" content="dark light">
  <title>Admin — DMaior Agency</title>

  <!-- Boot de tema: aplica data-theme antes do 1º paint (mesmo dm_tema do site/agente) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('dm_tema');
        if (t && t !== 'original') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #0a0e27; min-height: 100%; width: 100%; }
    /* Fundo acompanha o tema escolhido na aba Aparência */
    html[data-theme="dark"],    html[data-theme="dark"] body    { background: #000; }
    html[data-theme="branco"],  html[data-theme="branco"] body  { background: #e8eef5; }
    html[data-theme="rosa"],    html[data-theme="rosa"] body    { background: #fce4ec; }
    html[data-theme="laranja"], html[data-theme="laranja"] body { background: #fff1e0; }
    dmaior-admin { display: block; width: 100%; min-height: 100vh; }
  </style>
</head>
<body>
  <!-- Componente admin completo — login + painel embutidos no custom element -->
  <dmaior-admin></dmaior-admin>

  <!-- api.js expõe DmaiorConfig (URLs dos workers) para o componente usar -->
  <script charset=utf-8 src="js/utils/helpers.js"></script>
  <script charset=utf-8 src="js/api.js?v=20260903-push-url"></script>
  <!-- Motor de preferências (tema/fonte/idioma) — mesmo do site/agente. Expõe window.DMaiorPrefs -->
  <script charset=utf-8 src="js/preferences.js?v=20260905-admin-aparencia"></script>
  <!-- Componente admin original — contém todo visual e lógica de login/painel -->
  <script charset=utf-8 src="js/components/dmaior-admin.js?v=20260905-redesign-5"></script>
  <!-- router.js NÃO é carregado aqui: o admin tem login próprio embutido -->
  <dmaior-cookie-consent></dmaior-cookie-consent>
  <script charset=utf-8 src="js/components/cookie-consent.js"></script>
  <script charset=utf-8 src="js/pwa.js?v=20260703-pwa-1"></script>
</body>
</html>
